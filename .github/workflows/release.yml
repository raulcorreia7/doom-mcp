name: DMCP CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
    tags:
      - 'dmcp-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK build/test (${{ matrix.os }}, ${{ matrix.linkage }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            linkage: static
            shared: OFF
            artifact_name: dmcp-sdk-linux-static
            asset_name: dmcp-sdk-linux-static.tar.gz
          - os: ubuntu-latest
            platform: linux
            linkage: shared
            shared: ON
            artifact_name: dmcp-sdk-linux-shared
            asset_name: dmcp-sdk-linux-shared.tar.gz
          - os: macos-latest
            platform: macos
            linkage: static
            shared: OFF
            artifact_name: dmcp-sdk-macos-static
            asset_name: dmcp-sdk-macos-static.tar.gz
          - os: macos-latest
            platform: macos
            linkage: shared
            shared: ON
            artifact_name: dmcp-sdk-macos-shared
            asset_name: dmcp-sdk-macos-shared.tar.gz
          - os: windows-latest
            platform: windows
            linkage: static
            shared: OFF
            artifact_name: dmcp-sdk-windows-static
            asset_name: dmcp-sdk-windows-static.zip
          - os: windows-latest
            platform: windows
            linkage: shared
            shared: ON
            artifact_name: dmcp-sdk-windows-shared
            asset_name: dmcp-sdk-windows-shared.zip

    steps:
      - name: Checkout DMCP
        uses: actions/checkout@v7

      - name: Build and test SDK
        shell: bash
        run: scripts/ci/build_sdk_entry.sh --build-dir "build/${{ matrix.linkage }}" --shared "${{ matrix.shared }}"

      - name: Local source consumer smoke
        shell: bash
        run: scripts/ci/source_consumer_smoke.sh --build-dir "build/source-consumer-${{ matrix.linkage }}" --shared "${{ matrix.shared }}"

      - name: Verify CI stayed headless
        shell: bash
        run: scripts/ci/verify_headless.sh

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/dmcp-v')
        shell: bash
        run: scripts/ci/verify_release_tag.sh --tag "${{ github.ref_name }}"

      - name: Package SDK
        if: startsWith(github.ref, 'refs/tags/dmcp-v')
        shell: bash
        run: >
          scripts/ci/package_sdk.sh
          --build-dir "build/${{ matrix.linkage }}"
          --platform "${{ matrix.platform }}"
          --linkage "${{ matrix.linkage }}"
          --asset-name "${{ matrix.asset_name }}"
          --release-tag "${{ github.ref_name }}"

      - name: Upload SDK artifact
        if: startsWith(github.ref, 'refs/tags/dmcp-v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  adapters:
    name: Adapter build/link checks
    if: ${{ !startsWith(github.ref, 'refs/tags/dmcp-v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DMCP
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsdl2-dev \
            libpng-dev \
            libsamplerate0-dev

      - name: Build and test adapters
        shell: bash
        run: scripts/ci/check_adapters.sh

  release:
    name: Publish SDK release
    if: startsWith(github.ref, 'refs/tags/dmcp-v')
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout DMCP
        uses: actions/checkout@v7

      - name: Download SDK artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish SDK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          scripts/ci/publish_sdk_release.sh
          --tag "${{ github.ref_name }}"
          --artifacts-dir dist
          --title "DMCP SDK ${{ github.ref_name }}"
